<body><header class="site-nav" id="site-nav">

<main class="auth-wrap"><section class="auth-card">
<div class="eyebrow">MEMBER ACCESS</div>
<h1 style="font-size:38px;margin:14px 0 8px">Set a new password</h1>
<p class="lead" id="rp-subtitle" style="font-size:14px">Opening your secure reset link…</p>

<form id="rp-form" class="hidden">
  <div class="field">
    <label>NEW PASSWORD</label>
    <div class="pw-wrap">
      <input id="rp-password" type="password" autocomplete="new-password" required placeholder="Enter a new password">
      <button type="button" class="pw-toggle" data-toggle-for="rp-password" aria-label="Show password">👁</button>
    </div>
    <div class="password-meter" id="rp-meter-wrap"><i id="rp-meter"></i></div>
    <small class="field-hint">Minimum 8 characters.</small>
  </div>
  <div class="field">
    <label>CONFIRM NEW PASSWORD</label>
    <div class="pw-wrap">
      <input id="rp-confirm" type="password" autocomplete="new-password" required placeholder="Re-enter the new password">
      <button type="button" class="pw-toggle" data-toggle-for="rp-confirm" aria-label="Show password">👁</button>
    </div>
  </div>
  <p class="auth-msg" id="rp-msg" role="status" aria-live="polite"></p>
  <button class="primary" id="rp-submit" type="submit" style="width:100%">Update Password</button>
</form>

<div class="hidden" id="rp-invalid">
  <p class="auth-msg" style="color:#ff6b8a">This reset link is invalid or has expired.</p>
  <a class="primary" href="auth.html" style="display:inline-flex;margin-top:8px">Request a new link ↗</a>
</div>
</section></main>
<div class="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="script.js" defer></script>
<script>
(function(){
  const $=(s,r=document)=>r.querySelector(s);
  const form=$('#rp-form'), subtitle=$('#rp-subtitle'), invalid=$('#rp-invalid');
  let recoveryReady=false;

  document.querySelectorAll('.pw-toggle').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const input=$('#'+btn.dataset.toggleFor);
      const showing=input.type==='text';
      input.type=showing?'password':'text';
      btn.textContent=showing?'👁':'🙈';
    });
  });
  $('#rp-password').addEventListener('input', e=>{
    const s=DLAuth.passwordScore(e.target.value);
    const widths=['4%','20%','40%','60%','80%','100%'];
    const colors=['#ff6b8a','#ff6b8a','#ffb054','#ffc857','#9be27a','#6fffe9'];
    $('#rp-meter').style.width=widths[s];
    $('#rp-meter').style.background=colors[s];
  });

  function showForm(){
    recoveryReady=true;
    subtitle.textContent='Choose a new password for your account.';
    form.classList.remove('hidden');
  }
  function showInvalid(){
    subtitle.textContent='';
    invalid.classList.remove('hidden');
  }

  // Supabase automatically parses the recovery token from the URL
  // (detectSessionInUrl:true) and fires this event once it's ready.
  window.supabaseClient.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY') showForm();
  });
  // Fallback: if a session already exists shortly after load (recovery
  // token processed before our listener attached), show the form too.
  setTimeout(async ()=>{
    if(recoveryReady)return;
    const session = await DLAuth.getCurrentSession();
    if(session && location.hash.includes('type=recovery')) showForm();
    else if(!recoveryReady) showInvalid();
  }, 1200);

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const msg=$('#rp-msg'), btn=$('#rp-submit');
    const p1=$('#rp-password').value, p2=$('#rp-confirm').value;
    msg.textContent=''; msg.style.color='var(--muted)';
    if(p1!==p2){ msg.style.color='#ff6b8a'; msg.textContent='Passwords do not match.'; return; }
    const original=btn.textContent;
    btn.textContent='Updating...'; btn.disabled=true;
    try{
      await DLAuth.updatePassword(p1);
      msg.style.color='#6fffe9';
      msg.textContent='Password updated! Redirecting you to sign in...';
      setTimeout(()=>{ location.href='auth.html'; }, 1400);
    } catch(err){
      msg.style.color='#ff6b8a';
      msg.textContent = err.message || 'Something went wrong. Please try again.';
      btn.textContent=original; btn.disabled=false;
    }
  });
})();
</script>
</body></html>
